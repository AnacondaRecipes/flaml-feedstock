{% set name = "flaml" %}
{% set version = "2.3.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f3237d3e4970b93800ff175389362a8de6d68af4bc333c211931791e9b26debe

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # Python 3.13+ is excluded because the test environment cannot be resolved
  # due to incompatible dependency constraints and unavailable compatible builds
  # of older dependencies (e.g., XGBoost <2.0.0).
  skip: True  # [py<38 or py>312]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python
    # AttributeError: `np.NaN` was removed in the NumPy 2.0 release. Use `np.nan` instead.
    # Set last compatible version for NumPy
    - numpy >=1.17.0,<2.0
  run_constrained:
    # Autogen
    - openai ==0.27.8
    # Blendsearch/Synapse
    - optuna >=2.8.0,<=3.6.1
    # Catboost
    # CatBoost is optional; keep the existing Anaconda constraint.
    # Upstream applies Python-specific upper bounds for the catboost extra.
    - catboost >=0.26
    # Forecast/Ts_forecast
    - holidays <0.14
    - prophet >=1.0.1
    - statsmodels >=0.12.2
    # - hcrystalball ==0.1.10
    - pytorch-forecasting >=0.9.0  # [py<311]
    # Hf/Nlp
    # - transformers ==4.26
    - torch >=1.7,!=1.12.0
    # Ray
    - ray >=1.13,<2.dev0
    # Spark/Synapse
    - pyspark >=3.2.0
    - joblibspark >=0.5.0
    - joblib <=1.3.2
    # Vw
    # Duplicated in the test section for all platforms except Windows.
    - vowpalwabbit >=8.10.0,<9.0.0  # [win]

# ModuleNotFoundError: No module named 'hcrystalball'
{% set deselect_tests = " --deselect=test/test_model.py::test_prep" %}
# Pkg vowpalwabbit is not created for the win platform
{% set deselect_tests = deselect_tests + " --deselect=test/test_autovw.py::TestAutoVW::test_vw_oml_problem_and_vanilla_vw" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=test/test_autovw.py::TestAutoVW::test_supervised_vw_tune_namespace" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=test/test_autovw.py::TestAutoVW::test_supervised_vw_tune_namespace_learningrate" %}  # [win]
{% set deselect_tests = deselect_tests + " --deselect=test/test_conda_distribution.py::test_package_minimum" %}  # [win]

test:
  source_files:
    - test
  imports:
    - flaml
  commands:
    - pip check
    - pytest -v {{ deselect_tests }} test
  requires:
    - pip
    - pytest
    - openml >=0.10.2,<=0.12.2
    # CatBoost 1.0.6 fails pip check due to invalid wheel metadata.
    # CatBoost 1.2 was validated on linux-64 with Python 3.10.
    # See https://github.com/pypa/pip/issues/12884
    - catboost >=1.2,<=1.2.10
    - xgboost >=0.90,<2.0.0
    - lightgbm >=2.3.1
    # Pkg is not created for the win platform
    - vowpalwabbit  # [not win]

about:
  home: https://github.com/microsoft/FLAML
  summary: A fast and lightweight autoML system
  license: MIT
  license_file: LICENSE
  license_family: MIT
  dev_url: https://github.com/microsoft/FLAML
  doc_url: https://microsoft.github.io/FLAML/
  description: FLAML is a lightweight Python library that finds accurate machine learning models automatically, efficiently and economically.

extra:
  recipe-maintainers:
    - michalchromcak
    - skzhang1
